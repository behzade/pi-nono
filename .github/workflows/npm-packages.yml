name: npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/npm-packages.yml"
      - "extensions/sandbox/**"
      - "packaging/npm/**"

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Test release tooling
        run: node --test packaging/npm/*.test.mjs
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./extensions/sandbox/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: |
          node packaging/npm/build-packages.mjs main --out "$PWD/dist/npm"
          mkdir -p dist/tarballs
          npm pack ./dist/npm/pi-nono --pack-destination dist/tarballs
          tar -tf dist/tarballs/*.tgz | tee dist/main-contents.txt
          ! grep -E '(\.test\.ts|test-setup\.ts|package-lock\.json)$' dist/main-contents.txt
          grep -F 'package/README.md' dist/main-contents.txt
          grep -F 'package/LICENSE' dist/main-contents.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-nono-main-npm
          path: dist/tarballs/*.tgz

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - run: |
          mkdir -p dist/download dist/extract dist/tarballs
          curl -fsSLo dist/download/nono.tar.gz https://github.com/nolabs-ai/nono/releases/download/v0.75.0/nono-v0.75.0-aarch64-apple-darwin.tar.gz
          echo '7f33f113b193900600b54951c306137ad7e04346adebaa14283c752b7673c7d0  dist/download/nono.tar.gz' | shasum -a 256 -c
          tar -xzf dist/download/nono.tar.gz -C dist/extract
          nono=$(find "$PWD/dist/extract" -type f -name nono -perm -111 -print -quit)
          test -n "$nono"
          curl -fsSLo dist/download/NONO-LICENSE https://raw.githubusercontent.com/nolabs-ai/nono/v0.75.0/LICENSE
          node packaging/npm/build-packages.mjs native \
            --platform darwin --arch arm64 --out "$PWD/dist/npm" \
            --nono "$nono" --nono-license "$PWD/dist/download/NONO-LICENSE"
          node packaging/npm/build-packages.mjs main --out "$PWD/dist/npm"
          npm pack ./dist/npm/pi-nono-darwin-arm64 --pack-destination dist/tarballs
          npm pack ./dist/npm/pi-nono --pack-destination dist/tarballs
          version=$(node -p "require('./extensions/sandbox/package.json').version")
          mkdir dist/install
          cd dist/install
          npm init -y
          npm install --ignore-scripts --legacy-peer-deps \
            "../tarballs/pi-nono-darwin-arm64-$version.tgz" \
            "../tarballs/pi-nono-$version.tgz" \
            @earendil-works/pi-coding-agent@0.84.2
          mkdir home
          HOME="$PWD/home" PI_OFFLINE=1 ./node_modules/.bin/pi --no-extensions \
            -e "$PWD/node_modules/pi-nono/index.ts" --list-models >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-nono-darwin-arm64-npm
          path: dist/tarballs/pi-nono-darwin-arm64-*.tgz

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - run: |
          mkdir -p dist/download dist/extract dist/tarballs
          curl -fsSLo dist/download/nono.tar.gz https://github.com/nolabs-ai/nono/releases/download/v0.75.0/nono-v0.75.0-x86_64-unknown-linux-gnu.tar.gz
          echo '2f883269824d85f96a75fb8788f6c31619e60d2c0865e93402d2f347461054fa  dist/download/nono.tar.gz' | sha256sum -c
          tar -xzf dist/download/nono.tar.gz -C dist/extract
          nono=$(find "$PWD/dist/extract" -type f -name nono -perm -111 -print -quit)
          test -n "$nono"
          curl -fsSLo dist/download/NONO-LICENSE https://raw.githubusercontent.com/nolabs-ai/nono/v0.75.0/LICENSE
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          command -v bwrap
          node packaging/npm/build-packages.mjs native \
            --platform linux --arch x64 --out "$PWD/dist/npm" \
            --nono "$nono" --nono-license "$PWD/dist/download/NONO-LICENSE"
          node packaging/npm/build-packages.mjs main --out "$PWD/dist/npm"
          npm pack ./dist/npm/pi-nono-linux-x64 --pack-destination dist/tarballs
          npm pack ./dist/npm/pi-nono --pack-destination dist/tarballs
          version=$(node -p "require('./extensions/sandbox/package.json').version")
          mkdir dist/install
          cd dist/install
          npm init -y
          npm install --ignore-scripts --legacy-peer-deps \
            "../tarballs/pi-nono-linux-x64-$version.tgz" \
            "../tarballs/pi-nono-$version.tgz" \
            @earendil-works/pi-coding-agent@0.84.2
          mkdir home
          HOME="$PWD/home" PI_OFFLINE=1 ./node_modules/.bin/pi --no-extensions \
            -e "$PWD/node_modules/pi-nono/index.ts" --list-models >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-nono-linux-x64-npm
          path: dist/tarballs/pi-nono-linux-x64-*.tgz

  stage:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [main, darwin-arm64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Staged publishing requires npm >= 11.15.0.
          node-version: "24"
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pi-nono-*-npm
          path: release-assets
          merge-multiple: true
      - name: Stage native packages, then main package
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm stage publish "./release-assets/pi-nono-darwin-arm64-$version.tgz" --access public --tag next --ignore-scripts
          npm stage publish "./release-assets/pi-nono-linux-x64-$version.tgz" --access public --tag next --ignore-scripts
          npm stage publish "./release-assets/pi-nono-$version.tgz" --access public --tag next --ignore-scripts
          printf '%s\n' \
            '### npm approval required' \
            'Review the staged packages on npmjs.com and approve with 2FA: both native packages first, then pi-nono.' \
            'After all three are live, publish the GitHub release draft.' >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pi-nono-*-npm
          path: release-assets
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*.tgz
          --verify-tag --generate-notes --prerelease --draft
          --title "pi-nono $GITHUB_REF_NAME"
